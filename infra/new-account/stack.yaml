AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CS361 low-cost layout for a fresh account: one EC2 instance (Docker, SSM, no
  SSH) runs both the API and PostgreSQL, plus a private S3 bucket for files.
  Runtime configuration is published to SSM Parameter Store and the database
  password lives in Secrets Manager. The frontend (Amplify) and Cognito are
  set up by deploy.sh, not here.

Parameters:
  ProjectName:
    Type: String
    Default: cs361
    AllowedPattern: '[a-z0-9-]+'
  InstanceType:
    Type: String
    Default: t3.micro
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  # Learner Lab cannot create IAM roles, users or policies. In LabMode=true the
  # stack uses the pre-created LabInstanceProfile/LabRole instead of creating
  # AppRole, AppInstanceProfile and BackupSchedulerRole. Set LabMode=false in a
  # normal account to get least-privilege, stack-owned roles.
  LabMode:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Existing instance profile used when LabMode=true.
  AuthBackend:
    Type: String
    Default: cognito
    AllowedValues: ['cognito', 'local']
    Description: >-
      cognito uses the Cognito stack; local is the offline/demo fallback for
      environments where Cognito cannot be created. Local auth stores only a
      salted password hash in PostgreSQL and signs its own short-lived tokens.
  ConfigPrefix:
    Type: String
    Default: /cs361/config
    Description: SSM Parameter Store prefix shared by the Cognito/Amplify/backup stacks.
  CorsOrigins:
    Type: String
    Default: http://localhost:3000
    Description: Comma-separated browser origins allowed to call the API.
  BackupRetentionDays:
    Type: Number
    Default: 30
    Description: Days before objects under backups/ expire from the docs bucket.
  DbUsername:
    Type: String
    Default: cstu
  DbName:
    Type: String
    Default: cstu_demo

Conditions:
  # IAM roles are conditional only because Learner Lab forbids creating them.
  # A normal account (the default) gets stack-owned, least-privilege roles.
  CreateAppRole: !Equals [!Ref LabMode, 'false']
  # Local auth is an explicit fallback; Cognito remains the default.
  UseLocalAuth: !Equals [!Ref AuthBackend, 'local']

Resources:
  # --- Network: one VPC with one public subnet ------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public' }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref Subnet, RouteTableId: !Ref RouteTable }

  # Amplify has no fixed source IP, so the API port stays open (same as V2).
  # Port 3000 is the fallback frontend served from this instance.
  # PostgreSQL is never published: it is reachable only on the Docker network.
  # No SSH: the instance is managed through SSM Session Manager / Run Command.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend API
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: 0.0.0.0/0 }

  # --- Storage: uploaded PDFs and database backups ---------------------------
  DocsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-docs-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: !Ref BackupRetentionDays
            NoncurrentVersionExpiration: { NoncurrentDays: 7 }

  # --- Database secret -------------------------------------------------------
  # JSON shape expected by the backend: username, dbname and a generated
  # password. No explicit Name: CloudFormation generates a unique secret name.
  DbSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    Properties:
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}","dbname":"${DbName}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Fallback only: AUTH_BACKEND=local. Cognito remains the default and is
  # created by the separate cs361-cognito stack. This secret is created only
  # when the operator explicitly selects local auth.
  LocalAuthSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseLocalAuth
    DeletionPolicy: Delete
    Properties:
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # --- Backend identity (normal accounts only) -------------------------------
  AppRole:
    Type: AWS::IAM::Role
    Condition: CreateAppRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${DocsBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocsBucket.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ConfigPrefix}/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-backup-alerts'

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateAppRole
    Properties: { Roles: [!Ref AppRole] }

  # Used by EventBridge Scheduler in the backup stack (normal accounts only).
  # In LabMode the backup stack receives the LabRole ARN instead.
  BackupSchedulerRole:
    Type: AWS::IAM::Role
    Condition: CreateAppRole
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-backup-command
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/${ProjectName}-backup'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AppInstance}'

  # --- Backend instance ------------------------------------------------------
  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref AppSecurityGroup]
      # LabMode=true reuses LabInstanceProfile because IAM resources are denied.
      IamInstanceProfile: !If [CreateAppRole, !Ref AppInstanceProfile, !Ref InstanceProfileName]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          # 1 GB of RAM runs PostgreSQL + the API, but docker build needs swap.
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          dnf install -y docker jq
          systemctl enable --now docker
          # Amazon Linux 2023 ships the SSM agent; make sure it is running.
          systemctl enable --now amazon-ssm-agent || true
          mkdir -p /opt/cs361/pgdata
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-backend' }]

  # A public IPv4 address costs the same with or without an Elastic IP, and the
  # Elastic IP keeps Amplify's API_PROXY_TARGET valid across stop/start.
  AppAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref AppInstance

  # --- Runtime configuration shared with the other stacks --------------------
  ConfigS3Bucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/s3_bucket'
      Type: String
      Value: !Ref DocsBucket
  ConfigAwsRegion:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/aws_region'
      Type: String
      Value: !Ref AWS::Region
  ConfigCorsOrigins:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/cors_origins'
      Type: String
      Value: !Ref CorsOrigins
  ConfigDbSecretArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/db_secret_arn'
      Type: String
      Value: !Ref DbSecret
  ConfigLocalAuthSecretArn:
    Type: AWS::SSM::Parameter
    Condition: UseLocalAuth
    Properties:
      Name: !Sub '${ConfigPrefix}/local_auth_secret_arn'
      Type: String
      Value: !Ref LocalAuthSecret
  ConfigInstanceId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/instance_id'
      Type: String
      Value: !Ref AppInstance
  ConfigApiBaseUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${ConfigPrefix}/api_base_url'
      Type: String
      Value: !Sub 'http://${AppAddress}:8000'

Outputs:
  InstanceId:
    Value: !Ref AppInstance
  ApiBaseUrl:
    Value: !Sub 'http://${AppAddress}:8000'
  BucketName:
    Value: !Ref DocsBucket
  DbSecretArn:
    Value: !Ref DbSecret
  LocalAuthSecretArn:
    Condition: UseLocalAuth
    Value: !Ref LocalAuthSecret
  ConfigPrefix:
    Value: !Ref ConfigPrefix
  InstanceProfileName:
    Value: !If [CreateAppRole, !Ref AppInstanceProfile, !Ref InstanceProfileName]
  SecurityGroupId:
    Value: !Ref AppSecurityGroup
  FrontendUrl:
    Value: !Sub 'http://${AppAddress}:3000'
  # The backup stack needs this ARN; LabMode falls back to the pre-created LabRole.
  SchedulerRoleArn:
    Value: !If [CreateAppRole, !GetAtt BackupSchedulerRole.Arn, !Sub 'arn:aws:iam::${AWS::AccountId}:role/LabRole']
