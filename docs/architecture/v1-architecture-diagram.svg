<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PCSMS V1 supported architecture</title>
  <desc id="desc">Anonymous browser uses a strict public Next.js interface backed by FastAPI and PostgreSQL. Docker Compose starts database, seed, backend and frontend in order.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #64748b; }
      .box-title { font: 700 21px Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 16px Arial, sans-serif; fill: #475569; }
      .label { font: 600 15px Arial, sans-serif; fill: #334155; }
      .note { font: 400 15px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="70" y="70" class="title">PCSMS V1 - Supported Public Information Flow</text>
  <text x="70" y="102" class="subtitle">Current implementation: strict public API data, explicit states, reproducible PostgreSQL stack</text>

  <rect x="70" y="175" width="250" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="220" class="box-title">Anonymous browser</text>
  <text x="100" y="258" class="box-text">Public dashboard</text>
  <text x="100" y="286" class="box-text">Partner list + detail</text>
  <text x="100" y="314" class="box-text">Activity list + detail</text>

  <rect x="425" y="145" width="330" height="230" rx="18" fill="#fff7f7" stroke="#b91c1c" stroke-width="3"/>
  <text x="460" y="195" class="box-title">Next.js 16 frontend</text>
  <text x="460" y="235" class="box-text">Strict public loaders</text>
  <text x="460" y="266" class="box-text">Loading / Empty / Error / Retry</text>
  <text x="460" y="297" class="box-text">No public mock fallback</text>
  <text x="460" y="328" class="box-text">Anonymous default is public role</text>

  <rect x="855" y="145" width="350" height="230" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="890" y="195" class="box-title">FastAPI /api/v1</text>
  <text x="890" y="235" class="box-text">Published partner/activity DTOs</text>
  <text x="890" y="266" class="box-text">Stable {detail} errors</text>
  <text x="890" y="297" class="box-text">Draft/missing share 404</text>
  <text x="890" y="328" class="box-text">Health probes the database</text>

  <rect x="855" y="500" width="350" height="150" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text x="890" y="550" class="box-title">PostgreSQL 16</text>
  <text x="890" y="588" class="box-text">Constraints + indexes</text>
  <text x="890" y="619" class="box-text">Idempotent development seed</text>

  <rect x="425" y="500" width="330" height="150" rx="18" fill="#fffdf2" stroke="#ca8a04" stroke-width="3"/>
  <text x="460" y="550" class="box-title">Document storage</text>
  <text x="460" y="588" class="box-text">Local Docker volume (V1 dev)</text>
  <text x="460" y="619" class="box-text">S3 selectable for production</text>

  <line x1="320" y1="260" x2="415" y2="260" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="335" y="243" class="label">HTTP :3000</text>
  <line x1="755" y1="260" x2="845" y2="260" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="770" y="220" class="label">Public GET</text>
  <text x="770" y="241" class="label">:8000/api/v1</text>
  <line x1="1030" y1="375" x2="1030" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1050" y="442" class="label">SQLAlchemy</text>
  <line x1="855" y1="340" x2="705" y2="490" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="688" y="430" class="label">file bytes</text>

  <rect x="70" y="485" width="250" height="180" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="530" class="box-title">Docker Compose</text>
  <text x="100" y="568" class="box-text">1. database healthy</text>
  <text x="100" y="596" class="box-text">2. one-shot seed exits 0</text>
  <text x="100" y="624" class="box-text">3. backend healthy</text>
  <text x="100" y="652" class="box-text">4. frontend healthy</text>

  <text x="70" y="720" class="note">Evidence: backend tests, Next production build, Docker Compose smoke test - no stale mock screenshots.</text>
</svg>
