# Fictional demonstration data; independent of cstu_collaboration and RDS.
name: cs361-demo
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cstu_demo
      POSTGRES_USER: demo_app
      POSTGRES_PASSWORD: demo_local_only
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_app -d cstu_demo"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  seed:
    build: ./backend
    environment: &backend_environment
      DATABASE_URL: postgresql+psycopg2://demo_app:demo_local_only@database:5432/cstu_demo
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
      CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
    command: ["python", "seed_demo.py"]
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - demo_backend_storage:/app/storage
  backend:
    build: ./backend
    environment: *backend_environment
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - demo_backend_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
        NEXT_PUBLIC_API_BROWSER_URL: /api/v1
        API_PROXY_TARGET: http://backend:8000
        NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:3000/dashboard/public || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
volumes:
  demo_postgres_data:
  demo_backend_storage:
